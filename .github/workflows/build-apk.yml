name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
        defaults:
      run:
        working-directory: aether_gui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate Android scaffold and apply native overlay
        run: |
          flutter create --platforms=android --project-name aether_gui --org app.aether .
          bash tool/apply_overlay.sh

      - name: Fetch Aether binaries
        run: bash tool/fetch_aether.sh

      - name: Build tun2socks
        run: bash tool/build_tun2socks.sh

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: aether-apk
        path: aether_gui/build/app/outputs/flutter-apk/*.apk
